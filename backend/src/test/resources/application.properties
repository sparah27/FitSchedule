# Use H2 in-memory DB for integration tests — no MySQL required
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway is MySQL-specific — let Hibernate create the schema for tests
spring.flyway.enabled=false

app.jwt.secret=fitschedule-super-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-signing
app.jwt.expiration-ms=86400000
